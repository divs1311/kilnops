# =============================================================================
# SCENARIOS — each is a named set of overrides on the parameter defaults.
# `base` chains scenarios (overrides applied on top of the base scenario).
# `mc_ranges` [low, mode, high] replace yaml bounds for Monte Carlo in that
# scenario only (execution uncertainty conditional on the scenario's design).
# =============================================================================
scenarios:
  literature:
    label: "Literature defaults"
    description: "Every parameter at its assumptions.yaml default. The calibration-risk view."
    base: null
    overrides: {}
  plan_implied:
    label: "Plan-implied (Base)"
    description: "The design point that delivers ~100k t: 2.5 t dry batches in ~3 m³ kilns, 1.8 batches/day (single-shift ceiling), feedstock dried to ≤15% moisture. The plan the control tower tracks."
    base: null
    overrides:
      dry_biomass_per_batch_t: 2.5
      kiln_volume_m3: 3.0
      batches_per_kiln_day: 1.8
      biomass_moisture_frac: 0.13
      ch4_ef_g_per_kg_biochar: 5
    mc_ranges:
      dry_biomass_per_batch_t: [2.1, 2.5, 2.5]
      batches_per_kiln_day: [1.5, 1.8, 1.85]
      ch4_ef_g_per_kg_biochar: [5, 5, 12]
      biomass_moisture_frac: [0.10, 0.13, 0.20]
      biomass_availability_factor: [0.85, 1.0, 1.0]   # deeper stockouts live in the biomass-shock scenario
  biomass_shock:
    label: "Biomass shock"
    description: "Plan-implied, but a weak residue season: 15% of kiln-days without feedstock and wetter residue (CH4 up)."
    base: plan_implied
    overrides:
      biomass_availability_factor: 0.85
      biomass_moisture_frac: 0.20
      ch4_ef_g_per_kg_biochar: 12
  mrv_slippage:
    label: "MRV slippage"
    description: "Plan-implied, but evidence capture degrades (temperature logs and weights) and remediation is slow."
    base: plan_implied
    overrides:
      ev_temp_log: 0.88
      ev_photo: 0.93
      ev_feed_weight: 0.93
      ev_char_weight: 0.93
      evidence_remediation_frac: 0.10
      quality_rejection_frac: 0.04
  slow_ramp:
    label: "Slow ramp"
    description: "Plan-implied, but only 25% of kilns online in January and full fleet only by September."
    base: plan_implied
    overrides:
      ramp_start_share: 0.25
      ramp_full_month: 9
  upside:
    label: "Upside"
    description: "Plan-implied plus methodology credits high-temperature persistence (0.89), faster remediation and a fuller calendar."
    base: plan_implied
    overrides:
      persistence_factor: 0.89
      evidence_remediation_frac: 0.50
      ramp_full_month: 4
      op_days_jun: 12
      op_days_sep: 10
      op_days_nov: 21
